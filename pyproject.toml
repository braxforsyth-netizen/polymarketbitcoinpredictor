[project]
name = "btcpredict"
version = "0.1.0"
description = "Advisory terminal dashboard: live BTC news + 15-minute UP/DOWN probability vs Polymarket odds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "rich>=13.7",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
btcpredict = "btcpredict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btcpredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
